# Copy to common/secrets.yaml (and to the main ESPHome folder's secrets.yaml)
# and fill in your own values. Never commit the real file.
wifi_ssid: "YourWiFi"
wifi_password: "your-wifi-password"
ap_password: "fallback-hotspot-password"   # at least 8 characters
api_key: "base64-key-generated-by-the-esphome-dashboard="
# R503 sensor password: a DECIMAL number, unquoted (e.g. 1234567890)
fp_password: 1234567890
# Optional, Nuki security PIN (Smart Lock 3.0: 4 digits, 5th gen/Ultra: 6)
# nuki_pin: "1234"
