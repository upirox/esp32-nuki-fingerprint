# ============================================================
#  ESP32 (38 pin) + R503 fingerprint reader + SSD1306 OLED -> Nuki via BLE
#  Unlocking happens locally on the ESP32: it keeps working even when
#  Home Assistant or the Wi-Fi are down.
#  TESTED WORKING WITH ESPHOME 2026.9.1 - BUILD ISSUE WITH 2026.10.1
#  (libsodium conflict with the nuki_lock component)
#
#  Wiring:
#   R503  red VCC     -> 3V3      OLED 7 pin (SPI)
#         white 3.3VT -> 3V3        GND      -> GND
#         black GND   -> GND        VCC      -> 3V3
#         yellow TX   -> GPIO16     D0 (SCK) -> GPIO18
#         purple RX   -> GPIO17     D1 (MOSI)-> GPIO23
#         blue WAKEUP -> GPIO4      RES      -> GPIO26
#                                   DC       -> GPIO27
#                                   CS       -> GPIO5
#   OUTDOOR buzzer on the plate, passive, 3 pin (low level trigger)
#         VCC -> 3V3   GND -> GND   I/O -> GPIO25
#   INDOOR buzzer next to the ESP32 (same model): doorbell and sirens
#         VCC -> 3V3   GND -> GND   I/O -> GPIO21
#   WS2812B strip, 144 LEDs/m, 12 LEDs (83 mm)
#         +5V -> VIN   GND -> GND   DIN -> GPIO13 (330 ohm resistor)
#   AM312 PIR sensor (HW-740)
#         VCC -> 3V3   GND -> GND   OUT -> GPIO34 (+ 100 kOhm to GND, NOT 10 kOhm)
#   Doorbell push button (normally open)
#         one side -> GPIO33   other side -> GND   (internal pull-up)
#   Push button LED ring (3-6 V version)
#         LED+ -> GPIO32      LED- -> GND
#   Tamper: lever microswitch (C + NO) and reed switch IN SERIES, both
#   closed while the plate is mounted (the microswitch can't be fooled
#   with a magnet like a reed alone)
#         GPIO19 -> microswitch C -> NO -> reed -> GND   (internal pull-up)
#         plate mounted = circuit closed; plate removed or wire cut = alarm
#   Backup power (PowerBoost 1000C + 3 x 18650 in parallel)
#         mains present: +5V power supply -> 10k -> GPIO36 -> 20k -> GND
#         battery:       PowerBoost BAT   -> 100k -> GPIO39 -> 100k -> GND
#                                            (+ 100 nF between GPIO39 and GND)
#         During a blackout: strip at 30%, push button ring off while idle
#         and at 60% when the display turns on.
#
#  LED strip:
#    dim green, steady  = door locked
#    red, steady        = door unlocked / open
#    yellow, pulsing    = lock moving (opening/closing)
#    purple, pulsing    = lock jammed
#    dim blue           = Nuki unreachable / unknown state
#    red, blinking      = fingerprint not recognised
#    red, pulsing       = ALARM, reader locked out
#    blue, scanning     = fingerprint enrollment in progress
#
#  Home Assistant entities, actions and event texts are in English.
#  The messages shown on the OLED display are in Italian: they are plain
#  strings in the display lambda and in show_msg calls, change them freely.
# ============================================================

packages:
  base: !include common/base_config.yaml

substitutions:
  dev_friendly_name: "Ingresso"        # suffix of the package's diagnostic entities
  wifi_power_save: "LIGHT"             # REQUIRED: Wi-Fi and Bluetooth (Nuki) together
  name: nuki-fingerprint
  friendly_name: Nuki Fingerprint
  # Alarm
  max_attempts: "3"        # consecutive wrong fingerprints before the alarm
  lockout_minutes: "15"    # how long the reader stays locked out
  attempts_reset_minutes: "10"  # reset the error count if no other error happens within this time
  # Buzzer sounds (RTTTL format: name:d=duration,o=octave,b=bpm:notes)
  tone_ok: "ok:d=16,o=6,b=180:c,e,g,8c7"                 # access granted
  tone_fail: "ko:d=8,o=5,b=180:d,p,d"                    # fingerprint rejected
  tone_alarm: "alarm:d=8,o=6,b=200:c,g5,c,g5,c,g5,c,g5,c,g5" # alarm: siren
  tone_enroll_start: "enr:d=16,o=6,b=200:a,p,a"          # enrollment started
  tone_enroll_scan: "scan:d=16,o=7,b=200:c"              # scan ok, lift your finger
  tone_enroll_done: "done:d=16,o=6,b=160:c,e,g,c7,e7,8g7" # fingerprint saved
  tone_enroll_fail: "efail:d=8,o=6,b=160:g,e,c,4c5"      # enrollment failed
  # Colour of the sensor ring while the display is on.
  # The R503 only has fixed colours: RED, BLUE, PURPLE, GREEN, YELLOW, CYAN, WHITE.
  # WHITE looks warm; CYAN is the cooler alternative (bluish white).
  aura_presence_color: BLUE
  # Doorbell (INDOOR only): double ding-dong. Octave 7 (2-2.6 kHz) is where
  # passive buzzers resonate and sound loudest.
  tone_bell: "bell:d=4,o=7,b=100:e,2c,4p,e,2c"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        # Reset the sensor ring: the R503 stays powered during OTA and
        # would keep the last colour it was given (e.g. alarm red)
        - delay: 2s
        - globals.set: { id: booted, value: "true" }
        - logger.log:
            level: WARN
            format: "State restored at boot: fingerprint lockout=%s, errors=%d, tamper=%s"
            args: [ 'id(locked_out) ? "SI" : "no"', 'id(failed_attempts)', 'id(tamper_latched) ? "SI" : "no"' ]
        # Plate already open at boot (or wire disconnected): tamper
        - if:
            condition:
              binary_sensor.is_on: plate_open
            then:
              - script.execute: tamper_trigger
        # Fingerprint alarm active before the reboot: the lockout starts
        # over (${lockout_minutes} min), so cutting the power can't shorten it
        - if:
            condition:
              lambda: "return id(locked_out);"
            then:
              - logger.log:
                  level: WARN
                  format: "Rebooted during the fingerprint alarm: lockout restored"
              - script.execute: alarm_lockout
            else:
              # errors already counted: restart the timer that clears them
              - if:
                  condition:
                    lambda: "return id(failed_attempts) > 0;"
                  then:
                    - script.execute: attempts_reset
        - script.execute: aura_idle
        - script.execute: restore_strip
        - script.execute: screen_wake

# Values to remember (lockout, errors, tamper) are written to flash
# IMMEDIATELY instead of once a minute, so a power cut right after the
# alarm doesn't lose them. Flash is only written when a value changes.
preferences:
  flash_write_interval: 0s

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # required by the nuki_lock component

logger:

# wifi, fallback hotspot, captive_portal, ota and diagnostics: from the base package
api:
  encryption:
    key: !secret api_key
  # Actions callable from Home Assistant to manage fingerprints
  actions:
    - action: enroll
      variables:
        finger_id: int
        num_scans: int
      then:
        - fingerprint_grow.enroll:
            finger_id: !lambda "return finger_id;"
            num_scans: !lambda "return num_scans;"
    - action: cancel_enroll
      then:
        - fingerprint_grow.cancel_enroll:
        - script.execute: restore_strip
    - action: delete
      variables:
        finger_id: int
      then:
        - fingerprint_grow.delete:
            finger_id: !lambda "return finger_id;"
    - action: delete_all
      then:
        - fingerprint_grow.delete_all:
    # Cancel the alarm and unlock the reader before the timeout
    - action: reset_alarm
      then:
        - script.execute: alarm_clear
    # Play an RTTTL tune on the indoor buzzer, e.g. from an automation:
    #   action: esphome.<device_name>_play_indoor
    #   data: { tune: "beep:d=8,o=7,b=120:c,p,c" }
    - action: play_indoor
      variables:
        tune: string
      then:
        - rtttl.play:
            id: buzzer_in
            rtttl: !lambda "return tune;"
    # Stop any sound on the indoor buzzer
    - action: stop_indoor
      then:
        - rtttl.stop:
            id: buzzer_in

# ---------------- Nuki (BLE) ----------------
external_components:
  - source: github://uriyacovy/ESPHome_nuki_lock

lock:
  - platform: nuki_lock
    id: nuki
    name: Nuki Lock
    # Lock security PIN (the one set in the Nuki app):
    #  - Smart Lock 3.0: optional, 4 digits (only needed to change the
    #    lock settings from Home Assistant)
    #  - 5th Gen / Ultra / Go / Pro: required, 6 digits
    # To use it, add  nuki_pin: "1234"  to secrets.yaml and remove the #
    # security_pin: !secret nuki_pin
    event: "none"
    # --- Pairing and connection state ---
    pairing_mode:                 # switch in HA to start pairing
      name: Nuki Pairing Mode
    connected:
      name: Nuki Connected
    paired:
      name: Nuki Paired
    unpair:
      name: Nuki Unpair
    # --- Useful diagnostics ---
    battery_level:
      name: Nuki Battery
    battery_critical:
      name: Nuki Battery Critical
    bt_signal_strength:
      name: Nuki Bluetooth Signal
    door_sensor_state:            # text: closed / open / calibrating...
      name: Door Sensor State
    door_sensor:                  # open/closed with changing icon (for badges and automations)
      name: Entrance Door
      device_class: door
    # How often the Nuki advertises over Bluetooth:
    # more often = the ESP32 reaches it faster, but it drains the battery more
    advertising_mode:
      name: Nuki Advertising Mode

# ---------------- LED strip ----------------
light:
  - platform: esp32_rmt_led_strip
    id: strip
    name: Status LED Strip
    pin: GPIO13
    num_leds: 12
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 200ms
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: Red Blink
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 120ms
            - state: false
              duration: 120ms
      - pulse:
          name: Pulse
          transition_length: 600ms
          update_interval: 600ms
      - addressable_scan:
          name: Scan
          move_interval: 80ms
          scan_width: 3

  # Push button LED ring: dim while idle, full when someone comes close
  # or touches the reader, blinking while the doorbell rings
  - platform: monochromatic
    id: ring
    name: Doorbell Button Ring
    output: ring_out
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF          # turned on by on_boot
    effects:
      - strobe:
          name: Blink
          colors:
            - state: true
              brightness: 100%
              duration: 150ms
            - state: false
              duration: 150ms

# Refresh the strip whenever the Nuki state changes
# (commands from fingerprint, HA, the app or by hand on the lock)
interval:
  # Tamper status: publish only on change (no useless logs/traffic)
  - interval: 500ms
    then:
      - lambda: |-
          static std::string last;
          std::string st;
          if (id(tamper_latched) && id(plate_open).state) st = "Tamper - plate open";
          else if (id(tamper_latched))                    st = "Tamper - reset needed";  
          else if (id(plate_open).state)                  st = "Plate open";
          else                                            st = "Protected";
          if (st != last) {
            last = st;
            id(tamper_status).publish_state(st);
          }

  - interval: 300ms
    then:
      - lambda: |-
          if (!id(booted)) return;
          static int last = -1;
          int s = (int) id(nuki).state;
          if (s != last) {
            last = s;
            if (!id(fp_enrolling).state) id(restore_strip).execute();
            id(screen_wake).execute();       // every state change wakes the display
          }

# ---------------- Buzzers ----------------
output:
  # Each PWM output gets a channel on a DIFFERENT TIMER (channels 0, 2, 4):
  # channels 0-1, 2-3, 4-5 share a timer, and a tune on one buzzer, by
  # changing the frequency, would make the other one buzz non-stop.
  - platform: ledc
    id: buzzer_out
    channel: 0
    pin:
      number: GPIO25
      inverted: true     # "low level trigger" module: the pin idles high

  # Indoor buzzer, next to the ESP32
  - platform: ledc
    id: buzzer_in_out
    channel: 2
    pin:
      number: GPIO21
      inverted: true     # same "low level trigger" module

  # Doorbell push button LED ring, driven straight from the GPIO
  - platform: ledc
    id: ring_out
    channel: 4
    pin: GPIO32
    frequency: 1000Hz

rtttl:
  # Outdoor (plate): feedback for whoever is at the door, deterrent siren
  - id: buzzer
    output: buzzer_out
    gain: 50%            # volume: 50% = maximum (duty cycle); lower = quieter
  # Indoor (next to the ESP32): doorbell and alarms for whoever is home
  - id: buzzer_in
    output: buzzer_in_out
    # gain = PWM duty cycle: 50% is the MAXIMUM volume for a passive
    # buzzer. At 100% the output stays constant (no oscillation) and you
    # only hear clicks at note changes.
    gain: 50%

# ---------------- State and messages ----------------
globals:
  # Tamper lockout: stays active across reboots until it is
  # reset from Home Assistant
  - id: tamper_latched
    type: bool
    restore_value: true
    initial_value: "false"
  - id: doorbell_ringing       # ring blinking: screen_wake leaves it alone
    type: bool
    initial_value: "false"
  # Becomes true at the end of boot: stops the switch, while restoring
  # its state during boot, from using the display and sensor too early
  - id: booted
    type: bool
    initial_value: "false"
  # Error counter and lockout survive a reboot or a power cut:
  # removing power does not unlock the reader
  - id: failed_attempts
    type: int
    restore_value: true
    initial_value: "0"
  - id: locked_out
    type: bool
    restore_value: true
    initial_value: "false"
  - id: screen_on              # display on: the sensor ring stays lit
    type: bool
    initial_value: "false"
  - id: msg1
    type: std::string
    initial_value: '"Appoggia il dito"'
  - id: msg2
    type: std::string
    initial_value: '"sul lettore"'

script:
  # Tamper: reader locked, alarm, notification through HA
  - id: tamper_trigger
    mode: single
    then:
      - globals.set: { id: tamper_latched, value: "true" }
      - switch.turn_on: sw_reader_off
      - script.execute: aura_idle
      - script.execute: screen_wake
      - rtttl.play: { id: buzzer, rtttl: "${tone_alarm}" }
      - rtttl.play: { id: buzzer_in, rtttl: "${tone_alarm}" }   # warn indoors too
      - text_sensor.template.publish:
          id: last_event
          state: "TAMPER: plate removed, reader locked"
      - logger.log:
          level: WARN
          format: "Tamper detected: reader locked until reset from HA"

  # Idle state of the sensor ring:
  #   alarm -> steady red | reader disabled -> blinking red
  #   display on -> steady aura_presence_color (same duration) | otherwise off
  - id: aura_idle
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(locked_out);"
          then:
            - fingerprint_grow.aura_led_control:
                state: ALWAYS_ON
                speed: 0
                color: RED
                count: 0
          else:
            - if:
                condition:
                  switch.is_on: sw_reader_off
                then:
                  - fingerprint_grow.aura_led_control:
                      state: FLASHING
                      speed: 100
                      color: RED
                      count: 0          # 0 = forever
                else:
                  - if:
                      condition:
                        # display on (and no enrollment in progress):
                        # steady ring, invites the user to place a finger
                        lambda: "return id(screen_on) && !id(fp_enrolling).state;"
                      then:
                        - fingerprint_grow.aura_led_control:
                            state: ALWAYS_ON
                            speed: 0
                            color: ${aura_presence_color}
                            count: 0
                      else:
                        - fingerprint_grow.aura_led_control:
                            state: ALWAYS_OFF
                            speed: 0
                            color: BLUE
                            count: 0

  # Turns the display on and off again after 30 s of inactivity.
  # Every new call restarts the countdown (mode: restart).
  # During an alarm the display stays on.
  - id: screen_wake
    mode: restart
    then:
      - lambda: |-
          id(oled).turn_on();
          id(oled).update();
      # display just turned on (it was off): light the sensor ring.
      # If it was already on, leave the ring alone so confirmation or
      # error flashes in progress are not cut short.
      - if:
          condition:
            lambda: "return !id(screen_on);"
          then:
            - globals.set: { id: screen_on, value: "true" }
            - script.execute: aura_idle
      - if:
          condition:
            lambda: "return !id(doorbell_ringing);"
          then:
            - light.turn_on:
                id: ring
                effect: None
                brightness: !lambda "return id(mains_ok).state ? 1.0 : 0.6;"
      - delay: 30s
      - if:
          condition:
            lambda: "return !id(locked_out) && !id(tamper_latched);"
          then:
            - lambda: "id(oled).turn_off();"
            - globals.set: { id: screen_on, value: "false" }
            - script.execute: ring_rest
            - if:
                condition:
                  lambda: "return !id(fp_enrolling).state;"
                then:
                  - script.execute: aura_idle    # sensor ring off

  # Push button ring at rest (display off): 25% on mains power,
  # off during a blackout to save battery
  - id: ring_rest
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: mains_ok
          then:
            - light.turn_on: { id: ring, brightness: 25%, effect: None }
          else:
            - light.turn_off: ring

  # Strip colour from the alarm and Nuki state
  - id: restore_strip
    mode: restart
    then:
      - lambda: |-
          auto call = id(strip).turn_on();
          float r = 0, g = 0, b = 0, br = 0.6f;
          std::string fx = "None";
          if (id(locked_out)) {
            r = 1; br = 1.0f; fx = "Pulse";               // alarm
          } else {
            switch (id(nuki).state) {
              case lock::LOCK_STATE_LOCKED:
                g = 1; br = 0.25f; break;                      // locked: dim green (all good)
              case lock::LOCK_STATE_UNLOCKED:
              case lock::LOCK_STATE_OPEN:
              case lock::LOCK_STATE_OPENING:
                r = 1; break;                                  // unlocked: red (attention)
              case lock::LOCK_STATE_LOCKING:
              case lock::LOCK_STATE_UNLOCKING:
                r = 1; g = 0.7f; fx = "Pulse"; break;     // moving
              case lock::LOCK_STATE_JAMMED:
                r = 0.7f; b = 1; fx = "Pulse"; break;     // jammed
              default:
                b = 1; br = 0.15f; break;                      // unknown
            }
          }
          // on battery: strip at 30% (the alarm stays at full brightness)
          if (!id(mains_ok).state && !id(locked_out)) br *= 0.3f;
          call.set_rgb(r, g, b);
          call.set_brightness(br);
          call.set_effect(fx);
          call.perform();

  # Red blink for 1.5 s, then back to the state colour
  - id: flash_error
    mode: restart
    then:
      - light.turn_on:
          id: strip
          effect: Red Blink
      - delay: 1500ms
      - script.execute: restore_strip

  # Reset the error counter if there are no further failed attempts for
  # ${attempts_reset_minutes} minutes (every error restarts the timer)
  - id: attempts_reset
    mode: restart
    then:
      - delay: ${attempts_reset_minutes}min
      - if:
          condition:
            lambda: "return !id(locked_out) && id(failed_attempts) > 0;"
          then:
            - globals.set: { id: failed_attempts, value: "0" }
            - logger.log: "Wrong fingerprint counter reset"

  # Alarm: reader locked out for ${lockout_minutes} minutes
  - id: alarm_lockout
    mode: single
    then:
      - globals.set: { id: locked_out, value: "true" }
      - logger.log:
          level: WARN
          format: "Fingerprint alarm: lockout enabled and saved to flash"
      - script.stop: show_msg
      - script.stop: flash_error
      - script.execute: restore_strip
      - script.execute: screen_wake
      - fingerprint_grow.aura_led_control:   # sensor ring steady red
          state: ALWAYS_ON
          speed: 0
          color: RED
          count: 0
      - component.update: oled
      - rtttl.play: { id: buzzer, rtttl: "${tone_alarm}" }
      - rtttl.play: { id: buzzer_in, rtttl: "${tone_alarm}" }   # warn indoors too
      - text_sensor.template.publish:
          id: last_event
          state: "ALARM: ${max_attempts} wrong fingerprints, reader locked"
      - delay: ${lockout_minutes}min
      - script.execute: alarm_clear

  # End of alarm (on timeout, or from Home Assistant with reset_alarm)
  - id: alarm_clear
    mode: single
    then:
      - script.stop: alarm_lockout
      - globals.set: { id: locked_out, value: "false" }
      - globals.set: { id: failed_attempts, value: "0" }
      - script.execute: aura_idle
      - script.execute: restore_strip
      - script.execute: screen_wake          # restart the 30 s timeout
      - text_sensor.template.publish:
          id: last_event
          state: "Alarm cleared"

  # Doorbell: chime, on-screen message and event for HA.
  # mode: single + final delay = at most one ring every 5 s,
  # even if the button is pressed repeatedly.
  - id: doorbell_ring
    mode: single
    then:
      - globals.set: { id: doorbell_ringing, value: "true" }
      - script.execute: screen_wake
      - light.turn_on: { id: ring, effect: Blink }
      - rtttl.play: { id: buzzer_in, rtttl: "${tone_bell}" }    # indoor only: double ding-dong
      - event.trigger:
          id: doorbell_event
          event_type: "pressed"
      - script.execute:
          id: show_msg
          l1: "Din don!"
          l2: "Avviso in corso..."
      - text_sensor.template.publish:
          id: last_event
          state: "Doorbell rang"
      - delay: 3s
      - globals.set: { id: doorbell_ringing, value: "false" }
      - light.turn_on:
          id: ring
          effect: None
          brightness: !lambda "return id(mains_ok).state ? 1.0 : 0.6;"
      - if:
          condition:
            lambda: "return !id(screen_on);"
          then:
            - script.execute: ring_rest
      - delay: 2s

  # Show a message for 4 seconds, then go back to the idle one
  - id: show_msg
    mode: restart
    parameters:
      l1: string
      l2: string
    then:
      - lambda: |-
          id(msg1) = l1;
          id(msg2) = l2;
          id(oled).update();
      - delay: 4s
      - lambda: |-
          id(msg1) = "Appoggia il dito";
          id(msg2) = "sul lettore";
          id(oled).update();
      # once confirmation/error flashes are over, the ring goes back to its
      # idle state (lit if someone is still in front of the door)
      - if:
          condition:
            lambda: "return !id(fp_enrolling).state;"
          then:
            - script.execute: aura_idle

# ---------------- OLED display ----------------
spi:
  clk_pin: GPIO18       # D0
  mosi_pin: GPIO23      # D1

font:
  - file: "gfonts://Roboto@500"
    id: font_big
    size: 15
  - file: "gfonts://Roboto"
    id: font_small
    size: 11

display:
  - platform: ssd1306_spi
    id: oled
    model: "SSD1306 128x64"   # if the image is shifted by 2 px: "SH1106 128x64"
    # CS wired to GPIO5 (one more wire in the cable to the plate).
    # With CS tied to GND the display never turned on: CS resynchronises
    # the display on every command.
    # GPIO5 is a strapping pin: the compile warning is expected.
    cs_pin:
      number: GPIO5
      ignore_strapping_warning: true
    dc_pin: GPIO27
    reset_pin: GPIO26
    data_rate: 1MHz           # slower SPI for the 2 m cable
    update_interval: 2s
    lambda: |-
      if (id(tamper_latched)) {
        it.filled_rectangle(0, 0, 128, 19);
        it.print(64, 10, id(font_big), COLOR_OFF, TextAlign::CENTER, "! ALLARME !");
        it.print(64, 29, id(font_small), TextAlign::CENTER, "Sistema bloccato");
        it.print(64, 42, id(font_small), TextAlign::CENTER, "Accesso disabilitato");
      } else if (id(locked_out)) {
        // Inverted band at the top with the ALARM label
        it.filled_rectangle(0, 0, 128, 19);
        it.print(64, 10, id(font_big), COLOR_OFF, TextAlign::CENTER, "! ALLARME !");
        it.print(64, 29, id(font_small), TextAlign::CENTER, "Sistema bloccato");
        it.print(64, 42, id(font_small), TextAlign::CENTER, "Accesso disabilitato");
      } else if (id(sw_reader_off).state) {
        it.print(64, 18, id(font_big), TextAlign::CENTER, "Disattivato");
        it.print(64, 38, id(font_small), TextAlign::CENTER, "Usa chiave o app");
      } else if (id(msg1) != "Appoggia il dito") {
        // temporary message (welcome, not recognised, doorbell...)
        it.print(64, 18, id(font_big), TextAlign::CENTER, id(msg1).c_str());
        it.print(64, 38, id(font_small), TextAlign::CENTER, id(msg2).c_str());
      } else {
        // idle message matching the lock state:
        // "place your finger" only when a fingerprint is actually needed
        const char *a = "Appoggia il dito", *b = "sul lettore";
        switch (id(nuki).state) {
          case lock::LOCK_STATE_UNLOCKING:
          case lock::LOCK_STATE_OPENING:
            a = "Apertura..."; b = "attendi un istante"; break;
          case lock::LOCK_STATE_UNLOCKED:
          case lock::LOCK_STATE_OPEN:
            a = "Porta aperta"; b = "puoi entrare"; break;
          case lock::LOCK_STATE_LOCKING:
            a = "Chiusura..."; b = "attendi un istante"; break;
          case lock::LOCK_STATE_JAMMED:
            a = "Inceppata"; b = "usa la chiave"; break;
          default: break;   // locked or unknown state: a fingerprint is needed
        }
        it.print(64, 18, id(font_big), TextAlign::CENTER, a);
        it.print(64, 38, id(font_small), TextAlign::CENTER, b);
      }
      // Bottom status line: lock state
      const char *st = "Nuki: ?";
      switch (id(nuki).state) {
        case lock::LOCK_STATE_LOCKED:    st = "Porta chiusa"; break;
        case lock::LOCK_STATE_UNLOCKED:  st = "Porta sbloccata"; break;
        case lock::LOCK_STATE_LOCKING:   st = "Chiusura..."; break;
        case lock::LOCK_STATE_UNLOCKING: st = "Apertura..."; break;
        case lock::LOCK_STATE_JAMMED:    st = "Serratura bloccata"; break;
        default: break;
      }
      it.line(0, 52, 127, 52);
      it.print(64, 63, id(font_small), TextAlign::BOTTOM_CENTER, st);

# ---------------- Fingerprint reader ----------------
uart:
  rx_pin: GPIO16   # <- yellow (sensor TX)
  tx_pin: GPIO17   # -> purple (sensor RX)
  baud_rate: 57600

fingerprint_grow:
  id: fp
  sensing_pin: GPIO4          # blue (WAKEUP): low while a finger is present
  # --- SENSOR PASSWORD (protection against swapping the sensor) ---
  # The password has already been written to the sensor: ONLY
  # "password" stays active here. The value (decimal, unquoted) lives in
  # secrets.yaml as  fp_password: 1234567890
  # "new_password" is only used to change it: do NOT re-enable it.
  password: !secret fp_password
  # A finger on the sensor (WAKEUP) wakes the display
  on_finger_scan_start:
    - script.execute: screen_wake
  on_finger_scan_matched:
    - if:
        condition:
          lambda: "return !id(locked_out) && !id(sw_reader_off).state && confidence >= (int) id(min_confidence).state;"
        then:
          - globals.set:
              id: failed_attempts
              value: "0"
          - fingerprint_grow.aura_led_control:   # fingerprint accepted: green breathing
              state: BREATHING
              speed: 200
              color: GREEN
              count: 1
          - script.execute:
              id: show_msg
              l1: "Benvenuto"
              l2: "Apertura in corso"
          - rtttl.play: { id: buzzer, rtttl: "${tone_ok}" }
          # Pick ONE of the two:
          - lock.unlock: nuki       # turns the cylinder (unlock)
          # - lock.open: nuki       # unlock + pull the latch (opens the door)
          - text_sensor.template.publish:
              id: last_event
              state: !lambda 'return "Unlocked by fingerprint #" + to_string(finger_id);'
        else:
          # valid fingerprint but reader in alarm/disabled, or low confidence
          - rtttl.play: { id: buzzer, rtttl: "${tone_fail}" }
          - script.execute: screen_wake
          - if:
              condition:
                lambda: "return !id(locked_out) && !id(sw_reader_off).state;"
              then:
                # confidence below threshold: not counted as an error, asks to retry
                - script.execute:
                    id: show_msg
                    l1: "Lettura incerta"
                    l2: "Riappoggia il dito"
                - text_sensor.template.publish:
                    id: last_event
                    state: !lambda 'return "Fingerprint #" + to_string(finger_id) + " with low confidence (" + to_string(confidence) + ")";'
  # Finger misplaced or lifted too early: not counted as an error
  on_finger_scan_misplaced:
    - script.execute:
        id: show_msg
        l1: "Dito spostato"
        l2: "Tienilo fermo"
  # Unreadable image (dry, wet or dirty finger): not counted as an error
  on_finger_scan_invalid:
    - script.execute:
        id: show_msg
        l1: "Non leggibile"
        l2: "Appoggia tutto il dito"
  on_finger_scan_unmatched:
    - if:
        condition:
          lambda: "return id(locked_out) || id(sw_reader_off).state;"
        then:
          # alarm or reader disabled: no counting, just reject
          - rtttl.play: { id: buzzer, rtttl: "${tone_fail}" }
          - script.execute: screen_wake
        else:
          - lambda: "id(failed_attempts) += 1;"
          - script.execute: attempts_reset
          - rtttl.play: { id: buzzer, rtttl: "${tone_fail}" }
          - fingerprint_grow.aura_led_control:
              state: FLASHING
              speed: 25
              color: RED
              count: 2
          - script.execute:
              id: show_msg
              l1: "Non riconosciuto"
              l2: !lambda 'return "Tentativo " + to_string(id(failed_attempts)) + " di ${max_attempts}";'
          - script.execute: flash_error
          - text_sensor.template.publish:
              id: last_event
              state: !lambda 'return "Fingerprint not recognised (" + to_string(id(failed_attempts)) + "/${max_attempts})";'
          - if:
              condition:
                lambda: "return id(failed_attempts) >= ${max_attempts};"
              then:
                - delay: 1600ms           # let the reject sound and blink finish
                - script.execute: alarm_lockout
  on_enrollment_scan:
    - rtttl.play: { id: buzzer, rtttl: "${tone_enroll_scan}" }
    - script.execute: screen_wake
    - light.turn_on:
        id: strip
        brightness: 60%
        red: 0%
        green: 30%
        blue: 100%
        effect: Scan
    - fingerprint_grow.aura_led_control:
        state: FLASHING
        speed: 25
        color: BLUE
        count: 2
    - script.execute:
        id: show_msg
        l1: "Registrazione"
        l2: "Togli e riappoggia"
  on_enrollment_done:
    - rtttl.play: { id: buzzer, rtttl: "${tone_enroll_done}" }
    - fingerprint_grow.aura_led_control:
        state: BREATHING
        speed: 100
        color: BLUE
        count: 2
    - script.execute:
        id: show_msg
        l1: "Impronta salvata"
        l2: !lambda 'return "ID " + to_string(finger_id);'
  on_enrollment_failed:
    - rtttl.play: { id: buzzer, rtttl: "${tone_enroll_fail}" }
    - fingerprint_grow.aura_led_control:
        state: FLASHING
        speed: 25
        color: RED
        count: 4
    - script.execute:
        id: show_msg
        l1: "Registrazione"
        l2: "fallita, riprova"
    - script.execute: flash_error

sensor:
  # --- Backup battery ----------------------------------------------
  # Cell voltage read on GPIO39 through the 100k/100k divider (half the
  # voltage). Average of 6 readings: one value per minute.
  - platform: adc
    id: batt_voltage
    name: Backup Battery Voltage
    pin: GPIO39
    attenuation: 12db
    update_interval: 10s
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    entity_category: diagnostic
    filters:
      - multiply: 2.0                 # 1:2 divider
      - sliding_window_moving_average:
          window_size: 6
          send_every: 6
    on_value:
      - component.update: batt_percent

  # Percentage estimated from a Li-ion cell discharge curve.
  # On mains power the cell is charging: the percentage is only indicative.
  - platform: template
    id: batt_percent
    name: Backup Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      const float v = id(batt_voltage).state;
      if (isnan(v)) return {};
      static const float pts[][2] = {
        {3.00, 0}, {3.30, 5}, {3.50, 12}, {3.60, 22}, {3.70, 38},
        {3.80, 55}, {3.90, 68}, {4.00, 80}, {4.10, 92}, {4.20, 100}};
      if (v <= pts[0][0]) return 0.0f;
      for (int i = 1; i < 10; i++) {
        if (v <= pts[i][0]) {
          float t = (v - pts[i-1][0]) / (pts[i][0] - pts[i-1][0]);
          return pts[i-1][1] + t * (pts[i][1] - pts[i-1][1]);
        }
      }
      return 100.0f;

  - platform: fingerprint_grow
    fingerprint_count:
      name: Enrolled Fingerprints
    last_finger_id:
      name: Last Fingerprint ID
    last_confidence:
      name: Last Fingerprint Confidence

binary_sensor:
  # Mains power on the ESP32's line (5 V from the power supply, before
  # the PowerBoost). on = mains present, off = blackout: running on battery.
  # The delay ignores very short dips and the small glitches the ADC on
  # GPIO39 can induce on GPIO36 (known ESP32 erratum).
  - platform: gpio
    id: mains_ok
    name: Mains Power
    device_class: power
    pin: GPIO36                      # input only, pull-down = external 20k resistor
    filters:
      - delayed_on: 2s
      - delayed_off: 2s
    on_release:
      - if:
          condition:
            lambda: "return id(booted);"
          then:
            - text_sensor.template.publish:
                id: last_event
                state: "Mains power lost: running on battery"
            - logger.log:
                level: WARN
                format: "Mains power lost: power saving mode"
      # strip and ring always follow, even during boot
      - script.execute: restore_strip
      - if:
          condition:
            lambda: "return !id(screen_on);"
          then:
            - script.execute: ring_rest
    on_press:
      - if:
          condition:
            lambda: "return id(booted);"
          then:
            - text_sensor.template.publish:
                id: last_event
                state: "Mains power restored"
      # strip and ring always follow, even during boot
      - script.execute: restore_strip
      - if:
          condition:
            lambda: "return !id(screen_on);"
          then:
            - script.execute: ring_rest

  # Live tamper switch state (on = plate removed or wire cut)
  - platform: gpio
    id: plate_open
    name: Plate Removed
    device_class: tamper
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
    filters:
      - delayed_on: 300ms          # ignore vibrations and knocks on the door
      - delayed_off: 300ms
    on_press:
      - if:
          condition:
            lambda: "return id(booted);"
          then:
            - script.execute: tamper_trigger

  # Latched tamper: stays "on" until reset from HA.
  # Use it in automations for notifications.
  - platform: template
    id: tamper_alarm
    name: Plate Tamper
    device_class: tamper
    lambda: "return id(tamper_latched);"

  # Alarm for HA automations (phone notifications)
  - platform: template
    id: fp_alarm
    name: Fingerprint Alarm
    device_class: safety        # in HA: "Unsafe" while in alarm
    lambda: "return id(locked_out);"

  # --- AM312 PIR sensor (HW-740) ----------------------------------
  # Display and ring turn on as soon as someone approaches.
  # GPIO34 has no internal resistors: fit 100 kOhm between GPIO34 and GND
  # so the input stays at 0 if the PIR is disconnected. Do NOT use
  # 10 kOhm: the AM312 output is weak and drops to ~1.5 V (never detected).
  - platform: gpio
    id: pir
    name: Entrance Motion
    device_class: motion
    pin: GPIO34                  # input only, ideal for the PIR
    filters:
      - delayed_on: 100ms        # ignore very short glitches on the cable
      - delayed_off: 5s          # avoid rapid on/off toggling
    on_press:
      - script.execute: screen_wake        # display and sensor ring together

  # --- Doorbell push button ---------------------------------------
  - platform: gpio
    id: doorbell_button
    name: Doorbell Button
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms           # debounce, useful with the long cable
      - delayed_off: 30ms
    on_press:
      - script.execute: doorbell_ring

  - platform: fingerprint_grow
    id: fp_enrolling
    name: Fingerprint Enrolling
    on_press:
      - script.execute: screen_wake
      - rtttl.play: { id: buzzer, rtttl: "${tone_enroll_start}" }
      - script.stop: restore_strip
      - script.execute:
          id: show_msg
          l1: "Registrazione"
          l2: "Appoggia il dito"
      - light.turn_on:
          id: strip
          brightness: 60%
          red: 0%
          green: 30%
          blue: 100%
          effect: Scan
    # When enrollment ends, fails or is cancelled, go back to the state colour
    on_release:
      - delay: 2s
      - script.execute: restore_strip
      - script.execute: aura_idle

switch:
  # Disable the reader from HA: fingerprints are ignored, the ring blinks
  # red and the display says so. The state survives reboots.
  - platform: template
    id: sw_reader_off
    name: Disable Fingerprint Reader
    icon: mdi:fingerprint-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            lambda: "return id(booted);"
          then:
            - script.execute: aura_idle
            - script.execute: screen_wake
            - text_sensor.template.publish:
                id: last_event
                state: "Reader disabled from Home Assistant"
    on_turn_off:
      - if:
          condition:
            lambda: "return id(tamper_latched);"
          then:
            # during a tamper event it can only be re-enabled with "Reset Tamper"
            - switch.turn_on: sw_reader_off
            - text_sensor.template.publish:
                id: last_event
                state: "Tamper active: use Reset Tamper"
          else:
            - if:
                condition:
                  lambda: "return id(booted);"
                then:
                  - script.execute: aura_idle
                  - script.execute: screen_wake
                  - text_sensor.template.publish:
                      id: last_event
                      state: "Reader re-enabled from Home Assistant"

button:
  # Ring the doorbell on the indoor buzzer (test / call from HA)
  - platform: template
    name: Ring Indoor Chime
    icon: mdi:bell-ring
    on_press:
      - rtttl.play: { id: buzzer_in, rtttl: "${tone_bell}" }

  # Reset after a tamper event: only works with the plate mounted again
  - platform: template
    id: btn_tamper_reset
    name: Reset Tamper
    icon: mdi:shield-refresh
    on_press:
      - if:
          condition:
            binary_sensor.is_on: plate_open
          then:
            - text_sensor.template.publish:
                id: last_event
                state: "Reset refused: the plate is still open"
          else:
            - globals.set: { id: tamper_latched, value: "false" }
            - switch.turn_off: sw_reader_off
            - script.execute: aura_idle
            - script.execute: screen_wake
            - text_sensor.template.publish:
                id: last_event
                state: "Tamper reset, reader re-enabled"

  # Button on the device page in HA: cancel the alarm and unlock
  # the reader without waiting ${lockout_minutes} minutes
  - platform: template
    id: btn_reset_alarm
    name: Reset Fingerprint Alarm
    icon: mdi:fingerprint
    on_press:
      - if:
          condition:
            lambda: "return id(locked_out);"
          then:
            - script.execute: alarm_clear
            - logger.log: "Alarm cancelled from Home Assistant"

event:
  # Doorbell event for HA automations (notifications, chimes...)
  - platform: template
    id: doorbell_event
    name: Doorbell
    device_class: doorbell
    event_types:
      - "pressed"

number:
  # Minimum confidence on top of the sensor's own threshold.
  # Lower it if valid fingerprints are rejected with "Lettura incerta"
  # (uncertain reading on the display); check "Last Fingerprint Confidence".
  - platform: template
    id: min_confidence
    name: Fingerprint Confidence Threshold
    icon: mdi:fingerprint
    min_value: 0
    max_value: 200
    step: 5
    initial_value: 25
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

text_sensor:
  # Human-readable tamper status, handy for dashboards and badges
  - platform: template
    id: tamper_status
    name: Tamper Status
    icon: mdi:shield-lock
    # updated by the interval block only when the state changes
  - platform: template
    id: last_event
    name: Last Event
